name: Баг
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось и что произошло
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения / движка / пакета моделей
