name: engine

on:
  pull_request:
    paths: ["engine/**", "contracts/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", "contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements-engine.txt
            engine/requirements-test.txt
      - run: pip install -r requirements-engine.txt -r requirements-test.txt
      - run: python -m pytest -q
