name: Publish desktop release

on:
  pull_request:
    paths:
      - app/**
      - engine/**
      - tools/**
      - infra/desktop-release/**
      - infra/site-deploy/**
      - .github/workflows/desktop-release.yml
  push:
    branches: [main]
    paths:
      - app/**
      - engine/**
      - tools/**
      - infra/desktop-release/**
      - infra/site-deploy/**
      - .github/workflows/desktop-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/backend/requirements.lock -r engine/requirements-engine.txt -r engine/requirements-test.txt
      - run: python -m ruff check infra/desktop-release infra/site-deploy
      - run: python -m ruff format --check infra/desktop-release infra/site-deploy
      - run: python -m unittest discover -s infra/site-deploy -p 'test_*.py' -v
      - run: python -m unittest discover -s infra/desktop-release -p 'test_*.py' -v
      - run: node infra/desktop-release/test_site.mjs
      - name: Engine checks
        working-directory: engine
        run: python -m pytest -q
      - name: Require current protected packaging source
        run: python infra/desktop-release/prepare.py check "$RUNNER_TEMP/release-policy"

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/backend/requirements.lock -r engine/requirements-engine.txt
      - name: Licensing and profile/update integration
        run: >-
          python -m pytest --noconftest -q
          app/frontend/packaging/windows/test_licensing.py
          app/frontend/tests
      - name: Build, install and test Windows package
        shell: pwsh
        run: '& infra/desktop-release/build_windows.ps1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-x64
          path: |
            ${{ runner.temp }}/aira-release/release/*.exe
            ${{ runner.temp }}/aira-release/release/windows-x64.json
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/backend/requirements.lock -r engine/requirements-engine.txt
      - name: Licensing and profile/update integration
        run: >-
          python -m pytest --noconftest -q
          app/frontend/packaging/windows/test_licensing.py
          app/frontend/tests
      - name: Build Mac package, run full backend gate and test installed runtime
        run: python infra/desktop-release/build_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos-arm64
          path: |
            ${{ runner.temp }}/aira-release/release/*.dmg
            ${{ runner.temp }}/aira-release/release/macos-arm64.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install python-dotenv==1.2.3 cryptography==47.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-windows-x64
          path: release-artifacts/windows-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-macos-arm64
          path: release-artifacts/macos-arm64
      - name: Sign tested artifacts, publish both channels and verify public HTTPS
        env:
          AIRA_UPDATE_ED25519_SEED: ${{ secrets.AIRA_UPDATE_ED25519_SEED }}
        run: python infra/desktop-release/publish.py
