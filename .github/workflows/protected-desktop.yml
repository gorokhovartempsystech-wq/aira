name: protected-desktop

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/protected-desktop.yml"]

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verified protected model and existing PostgreSQL distribution
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'aira-build'
          New-Item -ItemType Directory -Force $work | Out-Null
          $models = Join-Path $work 'models.zip'
          Write-Host 'Downloading encrypted model archive'
          Invoke-WebRequest 'https://51.250.81.70/downloads/aira-models-0.2m-protected-1.zip' -OutFile $models -TimeoutSec 600
          if ((Get-FileHash $models -Algorithm SHA256).Hash.ToLower() -ne '7d4f227bd8f9edab1bbcbbddc199be8abeb5abd5b3b4329f717e5d041606ba4e') { throw 'Model archive hash mismatch' }
          Expand-Archive $models (Join-Path $work 'model')
          Write-Host 'Encrypted model hash verified and archive extracted'
          $old = Join-Path $work 'old.exe'
          Write-Host 'Downloading pinned PostgreSQL source installer'
          curl.exe --fail --silent --show-error --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 600 --output $old 'https://51.250.81.70/downloads/AIRA-Setup-0.2.0.exe'
          if ($LASTEXITCODE) { throw 'Pinned runtime download failed' }
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLower() -ne '01717fdeadcdb2ea5aa057e9e4330a2b6941167d962686ec5a439e549771a9fa') { throw 'PostgreSQL source installer hash mismatch' }
          Write-Host 'Pinned runtime download hash verified; starting extraction'
          $legacy = Join-Path $work 'legacy'
          $install = Start-Process $old -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART',"/DIR=$legacy", "/LOG=$work\legacy-install.log") -PassThru
          if (-not $install.WaitForExit(300000)) { throw 'Pinned runtime extraction timed out' }
          $install.Refresh()
          Write-Host 'Pinned runtime extracted'
          if ($install.ExitCode -ne 0) { throw 'Legacy runtime extraction failed' }
          $version = & "$legacy\pgsql\bin\postgres.exe" --version
          if ($version -notmatch 'PostgreSQL\) 18\.') { throw 'PostgreSQL 18 required' }
          python app/frontend/packaging/updates/fetch_sdk.py windows "$work\winsparkle"
          if ($LASTEXITCODE) { throw 'SDK download failed' }
      - name: Stage protected Windows runtime
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'aira-build'
          $sdk = (Get-ChildItem "$work\winsparkle" -Filter WinSparkle.dll -Recurse | Where-Object { $_.FullName -match 'x64\\Release' } | Select-Object -First 1).Directory.Parent.Parent.FullName
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          & app/frontend/packaging/windows/build.ps1 -ModelDir "$work\model\models-protected" -PgDir "$work\legacy\pgsql" -Python $env:pythonLocation -Out "$work\release" -Version '0.2.7' -WinSparkleDir $sdk -Iscc $iscc -StageOnly
          if ($LASTEXITCODE) { throw 'Installer build failed' }
      - name: Verify staged native startup before compression
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'aira-build'
          & "$work\release\stage\python\python.exe" -s -E tools/test_windows_launcher.py
          if ($LASTEXITCODE) { throw 'Windows static module regression failed' }
          python tools/smoke_windows_desktop.py "$work\release\stage"
          if ($LASTEXITCODE) { throw 'Staged desktop smoke failed' }
      - name: Build installer from tested staging
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'aira-build'
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          & $iscc /Q "/DSourceDir=$work\release\stage" '/DAppVersion=0.2.7' "/O$work\release" app/frontend/packaging/windows/aira.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
          $exe = "$work\release\AIRA-Setup-0.2.7.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content "$exe.sha256" "$hash  AIRA-Setup-0.2.7.exe" -Encoding ascii
      - name: Install new package and exercise native startup
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'aira-build'
          $install = Start-Process "$work\release\AIRA-Setup-0.2.7.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART',"/DIR=$work\installed") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Protected installer failed' }
          python tools/smoke_windows_desktop.py "$work\installed"
          if ($LASTEXITCODE) { throw 'Installed desktop smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AIRA-Windows-0.2.7
          path: |
            ${{ runner.temp }}/aira-build/release/AIRA-Setup-0.2.7.exe
            ${{ runner.temp }}/aira-build/release/AIRA-Setup-0.2.7.exe.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIRA-Windows-smoke-log
          path: ${{ runner.temp }}/AIRA-smoke.log
          if-no-files-found: ignore
          retention-days: 3
